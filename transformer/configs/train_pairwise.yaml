model:
  in_channels: 2
  embed_dim: 128
  depth: 4
  num_heads: 8
  patch_size: [16, 16]
  input_size: [128, 64]
  suppression_mode: frequency_aware

data:
  data_dir: ../mvdr/data/collected_batch_pairwise/
  categories:
    - DCBias
    - Harmonic
    - Loosen
    - PartialDischarge
  train_samples: 800
  val_samples: 200
  test_samples: 100
  sample_rate: 16000
  n_fft: 512
  hop_length: 256
  n_mels: 128
  split_ratio: [0.7, 0.15, 0.15]

train:
  batch_size: 2
  num_epochs: 5
  learning_rate: 1e-4
  weight_decay: 1e-5
  lambda_mask: 0.5
  num_workers: 16
  checkpoint_interval: 5
  seed: 42

runtime:
  device: auto
  output_dir: experiments/exper1_dataset_undivided
  cuda_fallback_to_cpu: true
